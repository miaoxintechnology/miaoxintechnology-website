<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验证码生成 / 解析工具</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 36px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1f2937, #0f172a);
    color: #1f2937;
  }

  h1 {
    margin: 0 0 6px;
    color: #f9fafb;
    font-size: 22px;
    text-align: center;
    letter-spacing: 1px;
  }

  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 28px;
  }

  .wrap { max-width: 1000px; margin: 0 auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 20px;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }

  .card h2 {
    margin: 0 0 18px;
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tag {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef2ff;
    color: #4f46e5;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4b5563;
    margin-bottom: 14px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    flex: 1;
    min-width: 0;
  }

  input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
  }

  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }

  button:hover { background: #4338ca; }
  button:active { transform: translateY(1px); }
  button:disabled { background: #a5b4fc; cursor: wait; }

  button.mini {
    width: auto;
    flex: 0 0 auto;
    padding: 0 14px;
    background: #0ea5e9;
    font-size: 13px;
    white-space: nowrap;
  }

  button.mini:hover { background: #0284c7; }

  .hint {
    font-size: 12px;
    font-weight: 400;
    color: #6b7280;
    margin-top: 6px;
    min-height: 16px;
    line-height: 1.5;
    font-family: inherit;
  }

  .hint.ok  { color: #047857; }
  .hint.err { color: #b45309; }

  .result {
    margin-top: 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    overflow: hidden;
  }

  .result.ok {
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    padding: 12px 14px;
  }

  .result.err {
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 12px 14px;
  }

  .res-title { font-weight: 700; margin-bottom: 6px; }
  .result.ok  .res-title { color: #047857; }
  .result.err .res-title { color: #b91c1c; }

  .res-line {
    color: #374151;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 13px;
    word-break: break-all;
  }

  .code-big {
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #4f46e5;
    margin: 4px 0 8px;
    word-break: break-all;
  }

  .err .code-big { color: #b91c1c; letter-spacing: 0; font-size: 14px; }
</style>
</head>
<body>

<div class="wrap">
  <h1>验证码生成 / 解析工具</h1>
  <div class="subtitle">
    规则：前两位 = A；第 3、4 位 = IP 第三段 + A；第 5、6 位 = IP 第四段 − A
  </div>

  <div class="grid">

    <!-- 正向 -->
    <section class="card">
      <h2><span class="tag">正向</span> 生成验证码</h2>

      <label>IP 地址
        <div class="input-row">
          <input id="f-ip" placeholder="例如 192.168.1.100" autocomplete="off">
          <button class="mini" id="f-auto">自动获取</button>
        </div>
        <div class="hint" id="f-hint"></div>
      </label>

      <label>前两位十六进制数
        <input id="f-prefix" placeholder="例如 1A" maxlength="2" autocomplete="off">
      </label>

      <button id="f-btn">生成验证码</button>

      <div class="result" id="f-result"></div>
    </section>

    <!-- 反向 -->
    <section class="card">
      <h2><span class="tag">反向</span> 解析对方 IP</h2>

      <label>本机 IP（用于获取前两段）
        <div class="input-row">
          <input id="r-ip" placeholder="例如 192.168.1.100" autocomplete="off">
          <button class="mini" id="r-auto">自动获取</button>
        </div>
        <div class="hint" id="r-hint"></div>
      </label>

      <label>6 位验证码
        <input id="r-code" placeholder="例如 1A1B4A" maxlength="6" autocomplete="off">
      </label>

      <button id="r-btn">解析对方 IP</button>

      <div class="result" id="r-result"></div>
    </section>

  </div>
</div>

<script>
/* ============ 工具函数 ============ */

const HEX_RE = /^[0-9A-F]+$/;
const IPV4_RE = /^\d{1,3}(\.\d{1,3}){3}$/;
const PRIVATE_RE = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/;

function toHex2(n) {
  return n.toString(16).toUpperCase().padStart(2, '0');
}

function parseIPv4(input) {
  const s = (input || '').trim();
  if (!s) throw new Error('请输入 IP 地址');

  const parts = s.split('.');
  if (parts.length !== 4) {
    throw new Error(`IP 格式错误："${s}" 不是合法的 IPv4 地址（应为 4 段，例如 192.168.1.100）`);
  }

  return parts.map(function (p) {
    if (!/^\d{1,3}$/.test(p)) {
      throw new Error(`IP 格式错误：段 "${p}" 不是 0~255 的十进制数字`);
    }
    if (p.length > 1 && p[0] === '0') {
      throw new Error(`IP 格式错误：段 "${p}" 不能有前导 0`);
    }
    const n = parseInt(p, 10);
    if (n < 0 || n > 255) {
      throw new Error(`IP 格式错误：段 "${p}" 超出 0~255`);
    }
    return n;
  });
}

function render(el, isError, title, rows) {
  el.classList.remove('ok', 'err');
  el.classList.add(isError ? 'err' : 'ok');
  el.textContent = '';

  const t = document.createElement('div');
  t.className = 'res-title';
  t.textContent = title;
  el.appendChild(t);

  (rows || []).forEach(function (r) {
    const d = document.createElement('div');
    d.className = r.big ? 'code-big' : 'res-line';
    d.textContent = r.text;
    el.appendChild(d);
  });
}

/* ============ 自动获取本机 IP ============ */

/**
 * 用 WebRTC 获取本机局域网 IPv4。
 * 现代浏览器可能返回 mDNS 名（xxx.local），此时正则匹配不到 IPv4，返回 null。
 */
function getLocalIPv4ViaWebRTC(timeoutMs) {
  timeoutMs = timeoutMs || 3000;
  return new Promise(function (resolve) {
    const found = new Set();
    let pc = null;
    let finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      try { if (pc) pc.close(); } catch (e) {}

      const ipv4 = [...found].filter(ip => IPV4_RE.test(ip));
      // 优先返回私网地址
      const priv = ipv4.find(ip => PRIVATE_RE.test(ip));
      resolve(priv || ipv4[0] || null);
    }

    try {
      const cfg = { iceServers: [] };
      pc = new RTCPeerConnection(cfg);

      pc.createDataChannel('probe');

      pc.onicecandidate = function (e) {
        if (!e.candidate) { finish(); return; }
        const c = e.candidate.candidate || '';
        const m = c.match(/(\d{1,3}(?:\.\d{1,3}){3})/);
        if (m) found.add(m[1]);
      };

      pc.createOffer()
        .then(o => pc.setLocalDescription(o))
        .catch(finish);

      setTimeout(finish, timeoutMs);
    } catch (err) {
      finish();
    }
  });
}

/** 获取公网 IPv4（可能失败） */
async function getPublicIPv4() {
  const urls = [
    'https://api.ipify.org?format=json',
    'https://ipinfo.io/json'
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      if (j && typeof j.ip === 'string' && IPV4_RE.test(j.ip)) return j.ip;
    } catch (e) { /* 忽略，试下一个 */ }
  }
  return null;
}

/**
 * 自动获取并填充 IP 输入框 + 显示来源提示
 */
async function autoFillIP(inputEl, hintEl, btnEl) {
  const oldText = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.textContent = '获取中…';
  hintEl.className = 'hint';
  hintEl.textContent = '正在探测本机 IP…';

  try {
    // 1) 先试局域网
    const local = await getLocalIPv4ViaWebRTC(3000);
    if (local) {
      inputEl.value = local;
      hintEl.className = 'hint ok';
      hintEl.textContent = `已识别局域网 IP：${local}`;
      return;
    }

    // 2) 回退公网
    hintEl.textContent = '未获取到局域网 IP，正在尝试公网 IP…';
    const pub = await getPublicIPv4();
    if (pub) {
      inputEl.value = pub;
      hintEl.className = 'hint err';
      hintEl.textContent =
        `已填入公网 IP：${pub}（浏览器隐私策略可能屏蔽内网 IP，` +
        `若验证码按局域网设计，请手动改成 192.168.x.x 这类内网地址）`;
      return;
    }

    // 3) 全失败
    hintEl.className = 'hint err';
    hintEl.textContent = '自动获取失败，请手动输入本机 IP';
  } catch (e) {
    hintEl.className = 'hint err';
    hintEl.textContent = '自动获取失败，请手动输入本机 IP';
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = oldText;
  }
}

/* ============ 正向：生成验证码 ============ */

function generateCode(ipInput, prefixInput) {
  const ip = parseIPv4(ipInput);
  const third = ip[2];
  const fourth = ip[3];

  let prefix = (prefixInput || '').trim().toUpperCase();
  if (prefix.length !== 2) {
    throw new Error('前两位必须是 2 位十六进制数，例如 1A');
  }
  if (!HEX_RE.test(prefix)) {
    throw new Error('前两位必须是十六进制数字，即 0-9、A-F');
  }

  const a = parseInt(prefix, 16);

  if (a > fourth) {
    throw new Error(
      `无法生成验证码：前两位 ${prefix} 转十进制为 ${a}，` +
      `大于 IP 第四段 ${fourth}，` +
      `会导致第5、6位计算结果 ${fourth - a} 小于 0`
    );
  }

  const b = third + a;
  const c = fourth - a;

  if (b < 0 || b > 255) {
    throw new Error(
      `无法生成验证码：第3、4位计算结果 ${b} 超出 0~255，无法用两位十六进制表示`
    );
  }
  if (c < 0 || c > 255) {
    throw new Error(
      `无法生成验证码：第5、6位计算结果 ${c} 超出 0~255，无法用两位十六进制表示`
    );
  }

  return {
    code: prefix + toHex2(b) + toHex2(c),
    prefix: prefix,
    a: a, b: b, c: c,
    third: third, fourth: fourth
  };
}

/* ============ 反向：解析对方 IP ============ */

function parseCode(localIpInput, codeInput) {
  const ip = parseIPv4(localIpInput);
  const first = ip[0];
  const second = ip[1];

  const code = (codeInput || '').trim().toUpperCase();
  if (code.length !== 6) {
    throw new Error('验证码必须是 6 位十六进制数');
  }
  if (!HEX_RE.test(code)) {
    throw new Error('验证码只能包含 0-9、A-F');
  }

  const a = parseInt(code.slice(0, 2), 16);
  const b = parseInt(code.slice(2, 4), 16);
  const c = parseInt(code.slice(4, 6), 16);

  const third = b - a;
  const fourth = c + a;

  if (third < 0) {
    throw new Error(
      `无法解析验证码：第3、4位 ${code.slice(2, 4)} 转十进制为 ${b}，` +
      `前两位 ${code.slice(0, 2)} 转十进制为 ${a}，` +
      `第三段 = ${b} - ${a} = ${third}，小于 0`
    );
  }
  if (third > 255) {
    throw new Error(`无法解析验证码：第三段 = ${b} - ${a} = ${third}，大于 255`);
  }
  if (fourth < 0) {
    throw new Error(`无法解析验证码：第四段 = ${c} + ${a} = ${fourth}，小于 0`);
  }
  if (fourth > 255) {
    throw new Error(
      `无法解析验证码：第5、6位 ${code.slice(4, 6)} 转十进制为 ${c}，` +
      `前两位 ${code.slice(0, 2)} 转十进制为 ${a}，` +
      `第四段 = ${c} + ${a} = ${fourth}，大于 255`
    );
  }

  return {
    ip: `${first}.${second}.${third}.${fourth}`,
    first: first, second: second,
    a: a, b: b, c: c,
    third: third, fourth: fourth,
    code: code
  };
}

/* ============ 页面交互 ============ */

// 自动获取按钮
document.getElementById('f-auto').addEventListener('click', function () {
  autoFillIP(
    document.getElementById('f-ip'),
    document.getElementById('f-hint'),
    this
  );
});

document.getElementById('r-auto').addEventListener('click', function () {
  autoFillIP(
    document.getElementById('r-ip'),
    document.getElementById('r-hint'),
    this
  );
});

// 正向生成
document.getElementById('f-btn').addEventListener('click', function () {
  const el = document.getElementById('f-result');
  const ipVal = document.getElementById('f-ip').value;
  const prefixVal = document.getElementById('f-prefix').value;

  try {
    const r = generateCode(ipVal, prefixVal);
    render(el, false, '✅ 生成成功', [
      { text: r.code, big: true },
      { text: `前两位 ${r.prefix} → 十进制 ${r.a}` },
      { text: `第3、4位：${r.third} + ${r.a} = ${r.b} → ${toHex2(r.b)}` },
      { text: `第5、6位：${r.fourth} - ${r.a} = ${r.c} → ${toHex2(r.c)}` },
      { text: `校验：${r.b} - ${r.a} = ${r.third}（第三段 ✓） ｜ ${r.c} + ${r.a} = ${r.fourth}（第四段 ✓）` }
    ]);
  } catch (e) {
    render(el, true, '❌ 错误', [{ text: e.message, big: true }]);
  }
});

// 反向解析
document.getElementById('r-btn').addEventListener('click', function () {
  const el = document.getElementById('r-result');
  const ipVal = document.getElementById('r-ip').value;
  const codeVal = document.getElementById('r-code').value;

  try {
    const r = parseCode(ipVal, codeVal);
    render(el, false, '✅ 解析成功', [
      { text: r.ip, big: true },
      { text: `对方 IP 前两段取自本机 IP：${r.first}.${r.second}` },
      { text: `前两位 ${r.code.slice(0, 2)} → 十进制 ${r.a}` },
      { text: `第三段 = ${r.code.slice(2, 4)}(${r.b}) - ${r.a} = ${r.third}` },
      { text: `第四段 = ${r.code.slice(4, 6)}(${r.c}) + ${r.a} = ${r.fourth}` }
    ]);
  } catch (e) {
    render(el, true, '❌ 错误', [{ text: e.message, big: true }]);
  }
});

// 回车快捷键
document.getElementById('f-prefix').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('f-btn').click();
});
document.getElementById('f-ip').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('f-btn').click();
});
document.getElementById('r-code').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('r-btn').click();
});
document.getElementById('r-ip').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('r-btn').click();
});
</script>
</body>
</html>
