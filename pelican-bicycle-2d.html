<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061c29">
<title>鹈鹕自行车竞赛 · Pelican Bicycle Race</title>
<style>
  :root{
    --ink:#071f2c;
    --ink-soft:#0b2d3c;
    --cream:#fff3d1;
    --cream-dim:rgba(255,243,209,.68);
    --mint:#9fe8da;
    --gold:#f6c452;
    --coral:#f05d47;
    --line:rgba(255,243,209,.24);
    --panel:rgba(6,30,43,.62);
    --green:#8ff0b0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#061c29}
  body{
    color:var(--cream);
    font-family:"Avenir Next","Trebuchet MS","Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overscroll-behavior:none;
  }
  button{font:inherit}
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(circle at 50% 18%, #0e3b4c 0%, #071e2c 58%, #04141e 100%);
  }
  #scene{
    display:block;
    width:100%;
    height:100%;
    user-select:none;
    -webkit-user-select:none;
  }
  .hud{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:18px;
    padding:24px;
    padding:
      max(clamp(14px,2.15vw,34px), env(safe-area-inset-top))
      max(clamp(14px,2.15vw,34px), env(safe-area-inset-right))
      max(clamp(14px,2.15vw,30px), env(safe-area-inset-bottom))
      max(clamp(14px,2.15vw,34px), env(safe-area-inset-left));
    pointer-events:none;
  }
  .topbar,.bottombar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:18px;
    width:100%;
  }
  .bottombar{align-items:flex-end}
  .brand{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
    animation:hud-in .85s cubic-bezier(.2,.8,.2,1) both;
  }
  .mark{
    position:relative;
    flex:0 0 auto;
    width:clamp(48px,4.2vw,62px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
    border-radius:50%;
    border:2px solid var(--cream);
    background:var(--gold);
    color:var(--ink);
    font-size:clamp(16px,1.55vw,22px);
    font-weight:950;
    letter-spacing:-.04em;
    transform:rotate(-7deg);
    box-shadow:0 7px 0 rgba(4,19,27,.28),0 10px 28px rgba(4,19,27,.3);
    animation:mark-float 6s ease-in-out infinite;
  }
  .mark::before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    border:1px dashed rgba(7,31,44,.55);
  }
  .mark::after{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    bottom:-7px;
    height:4px;
    border-radius:99px;
    background:
      repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 10px);
    opacity:.7;
  }
  .brand-copy{min-width:0}
  .kicker{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 6px;
    color:var(--mint);
    font-size:clamp(8px,.72vw,11px);
    font-weight:800;
    letter-spacing:.27em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .kicker::before{
    content:"";
    width:clamp(16px,2vw,30px);
    height:1px;
    background:currentColor;
    opacity:.75;
  }
  h1{
    margin:0;
    color:var(--cream);
    font-size:clamp(25px,3.38vw,52px);
    font-weight:950;
    line-height:.95;
    letter-spacing:.055em;
    white-space:nowrap;
    text-shadow:0 3px 0 rgba(3,18,27,.38),0 15px 34px rgba(1,12,19,.35);
  }
  .subtitle{
    margin:7px 0 0;
    color:rgba(255,243,209,.63);
    font-size:clamp(8px,.72vw,11px);
    font-weight:700;
    letter-spacing:.36em;
    white-space:nowrap;
  }
  .lock-card{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 13px 10px 11px;
    border:1px solid rgba(184,255,215,.28);
    border-radius:17px;
    background:linear-gradient(135deg,rgba(7,34,48,.8),rgba(7,34,48,.5));
    box-shadow:0 14px 38px rgba(2,15,23,.28),inset 0 1px 0 rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    animation:hud-in .85s .12s cubic-bezier(.2,.8,.2,1) both;
  }
  .lock-icon{
    flex:0 0 auto;
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:11px;
    color:#d9ffe8;
    background:rgba(83,220,140,.12);
    border:1px solid rgba(143,240,176,.24);
  }
  .lock-icon svg{width:18px;height:18px;display:block}
  .lock-copy{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .lock-copy strong{
    font-size:clamp(11px,1vw,14px);
    font-weight:850;
    letter-spacing:.1em;
    color:#f1ffe9;
  }
  .lock-copy span{
    font-size:clamp(7px,.62vw,9px);
    font-weight:800;
    letter-spacing:.17em;
    color:rgba(184,255,215,.62);
  }
  .lock-dot{
    flex:0 0 auto;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 13px rgba(143,240,176,.9);
    animation:lock-pulse 1.8s ease-out infinite;
  }
  .lock-metric{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1px;
    margin-left:2px;
    padding-left:11px;
    border-left:1px solid rgba(184,255,215,.19);
    white-space:nowrap;
  }
  .lock-metric span{
    color:rgba(184,255,215,.5);
    font-size:8px;
    font-weight:800;
    letter-spacing:.14em;
  }
  .lock-metric b{
    color:#dfffea;
    font-size:12px;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .lock-metric i{
    padding-left:2px;
    color:rgba(184,255,215,.5);
    font-size:8px;
    font-style:normal;
  }
  .race-card{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 14px 9px 9px;
    border:1px solid var(--line);
    border-radius:18px;
    background:linear-gradient(130deg,rgba(5,28,40,.61),rgba(5,28,40,.34));
    box-shadow:0 12px 34px rgba(0,10,17,.2),inset 0 1px 0 rgba(255,255,255,.065);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    animation:hud-up .9s .22s cubic-bezier(.2,.8,.2,1) both;
  }
  .pos-badge{
    width:53px;
    height:53px;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:var(--cream);
    color:var(--ink);
    line-height:1;
    box-shadow:inset 0 0 0 1px rgba(7,31,44,.14);
  }
  .pos-badge span{
    font-size:7px;
    font-weight:900;
    letter-spacing:.18em;
    opacity:.58;
  }
  .pos-badge strong{
    margin-top:2px;
    font-size:29px;
    font-weight:950;
    letter-spacing:-.08em;
  }
  .race-meta{display:flex;flex-direction:column;gap:3px;min-width:0;white-space:nowrap}
  .race-meta .overline{
    color:var(--mint);
    font-size:8px;
    font-weight:850;
    letter-spacing:.17em;
  }
  .race-meta strong{
    font-size:clamp(12px,1vw,15px);
    font-weight:850;
    letter-spacing:.07em;
  }
  .race-meta em{
    color:var(--cream-dim);
    font-size:9px;
    font-style:normal;
    font-weight:700;
    letter-spacing:.08em;
  }
  .stat-strip{
    display:flex;
    align-items:stretch;
    gap:0;
    padding:7px 4px;
    border:1px solid var(--line);
    border-radius:18px;
    background:linear-gradient(130deg,rgba(5,28,40,.55),rgba(5,28,40,.3));
    box-shadow:0 12px 34px rgba(0,10,17,.18),inset 0 1px 0 rgba(255,255,255,.055);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    animation:hud-up .9s .3s cubic-bezier(.2,.8,.2,1) both;
  }
  .stat{
    min-width:84px;
    padding:1px 17px;
    display:grid;
    grid-template-columns:auto auto;
    grid-template-rows:auto auto;
    align-items:end;
    column-gap:4px;
    border-right:1px solid rgba(255,243,209,.12);
  }
  .stat:last-child{border-right:0}
  .stat span{
    grid-column:1 / -1;
    margin-bottom:3px;
    color:rgba(255,243,209,.48);
    font-size:8px;
    font-weight:800;
    letter-spacing:.16em;
  }
  .stat strong{
    font-size:clamp(16px,1.42vw,21px);
    line-height:1;
    font-weight:850;
    letter-spacing:-.025em;
    font-variant-numeric:tabular-nums;
  }
  .stat em{
    align-self:end;
    padding-bottom:1px;
    color:rgba(255,243,209,.5);
    font-size:8px;
    font-style:normal;
    font-weight:750;
    letter-spacing:.04em;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
    animation:hud-up .9s .38s cubic-bezier(.2,.8,.2,1) both;
  }
  .hint{
    display:flex;
    align-items:center;
    gap:6px;
    margin-right:3px;
    color:rgba(255,243,209,.45);
    font-size:9px;
    font-weight:700;
    letter-spacing:.06em;
    white-space:nowrap;
  }
  kbd{
    padding:4px 6px;
    border:1px solid rgba(255,243,209,.2);
    border-bottom-color:rgba(255,243,209,.32);
    border-radius:5px;
    background:rgba(255,243,209,.07);
    color:rgba(255,243,209,.7);
    font-size:8px;
    font-family:inherit;
    letter-spacing:.08em;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
  }
  .icon-btn,.pill-btn{
    height:50px;
    border:1px solid var(--line);
    border-radius:15px;
    background:linear-gradient(145deg,rgba(255,243,209,.13),rgba(255,243,209,.055));
    color:var(--cream);
    box-shadow:0 10px 26px rgba(0,10,17,.18),inset 0 1px 0 rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    cursor:pointer;
    transition:transform .16s ease,background .16s ease,border-color .16s ease;
    outline:none;
  }
  .icon-btn{
    width:50px;
    display:grid;
    place-items:center;
    padding:0;
  }
  .icon-btn svg{width:20px;height:20px;display:block}
  .pill-btn{
    min-width:58px;
    padding:0 13px;
    font-size:13px;
    font-weight:850;
    letter-spacing:.03em;
    font-variant-numeric:tabular-nums;
  }
  .icon-btn:hover,.pill-btn:hover{
    background:linear-gradient(145deg,rgba(255,243,209,.21),rgba(255,243,209,.09));
    border-color:rgba(255,243,209,.38);
    transform:translateY(-2px);
  }
  .icon-btn:active,.pill-btn:active{transform:translateY(0) scale(.97)}
  .icon-btn:focus-visible,.pill-btn:focus-visible{box-shadow:0 0 0 3px rgba(159,232,218,.42)}
  .icon-play{display:none}
  .stage.is-paused .icon-pause{display:none}
  .stage.is-paused .icon-play{display:block}
  .stage.is-paused .lock-dot{
    background:var(--gold);
    box-shadow:0 0 13px rgba(246,196,82,.75);
    animation:none;
  }
  .stage.is-paused .lock-copy strong{color:var(--cream)}
  .paused-plate{
    position:absolute;
    left:50%;
    top:15%;
    z-index:6;
    padding:8px 15px;
    border:1px solid rgba(255,243,209,.25);
    border-radius:999px;
    background:rgba(5,27,39,.68);
    color:var(--cream);
    font-size:9px;
    font-weight:850;
    letter-spacing:.22em;
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    opacity:0;
    transform:translate(-50%,-6px);
    transition:opacity .2s ease,transform .2s ease;
    pointer-events:none;
  }
  .stage.is-paused .paused-plate{
    opacity:1;
    transform:translate(-50%,0);
  }
  @keyframes hud-in{
    from{opacity:0;transform:translateY(-10px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes hud-up{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes mark-float{
    0%,100%{transform:rotate(-7deg) translateY(0)}
    50%{transform:rotate(-4deg) translateY(-3px)}
  }
  @keyframes lock-pulse{
    0%{box-shadow:0 0 0 0 rgba(143,240,176,.48),0 0 13px rgba(143,240,176,.8)}
    65%{box-shadow:0 0 0 7px rgba(143,240,176,0),0 0 13px rgba(143,240,176,.8)}
    100%{box-shadow:0 0 0 0 rgba(143,240,176,0),0 0 13px rgba(143,240,176,.8)}
  }
  @media (max-width:900px){
    .hint,.subtitle{display:none}
    .stat{min-width:68px;padding:1px 12px}
    .lock-metric{display:none}
    .race-meta em{display:none}
  }
  @media (max-width:650px){
    .hud{padding:max(13px,env(safe-area-inset-top)) max(13px,env(safe-area-inset-right)) max(13px,env(safe-area-inset-bottom)) max(13px,env(safe-area-inset-left));gap:12px}
    .topbar{gap:10px}
    .brand{gap:9px}
    .kicker,.subtitle{display:none}
    h1{font-size:clamp(19px,5.2vw,27px);letter-spacing:.035em}
    .mark{width:42px;box-shadow:0 5px 0 rgba(4,19,27,.28)}
    .lock-card{padding:7px 9px;border-radius:13px;gap:7px}
    .lock-icon{width:29px;height:29px;border-radius:9px}
    .lock-icon svg{width:15px;height:15px}
    .lock-copy span{display:none}
    .lock-copy strong{font-size:10px;letter-spacing:.06em}
    .lock-dot{display:none}
    .race-card{padding:6px 9px 6px 6px;border-radius:14px;gap:8px}
    .pos-badge{width:43px;height:43px;border-radius:10px}
    .pos-badge strong{font-size:23px}
    .race-meta .overline{display:none}
    .race-meta strong{font-size:11px}
    .stat-strip{display:none}
    .icon-btn,.pill-btn{height:44px;border-radius:12px}
    .icon-btn{width:44px}
    .pill-btn{min-width:50px;padding:0 10px;font-size:11px}
    .paused-plate{top:12%;font-size:8px}
  }
  @media (max-width:360px){
    .mark{display:none}
    h1{font-size:19px}
    .lock-card{padding:7px 8px}
    .race-meta strong{font-size:10px}
  }
  @media (max-height:560px){
    .brand{transform:scale(.86);transform-origin:left top}
    .lock-card{transform:scale(.86);transform-origin:right top}
    .stat-strip{display:none}
    .race-card{transform:scale(.9);transform-origin:left bottom}
    .controls{transform:scale(.9);transform-origin:right bottom}
  }
  @media (prefers-reduced-motion:reduce){
    .brand,.lock-card,.race-card,.stat-strip,.controls{animation:none}
    .mark,.lock-dot{animation:none}
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sceneTitle sceneDesc">
    <title id="sceneTitle">鹈鹕自行车竞赛</title>
    <desc id="sceneDesc">三只戴着赛车头盔的鹈鹕在海滨赛道上骑行。它们的双脚通过实时腿部逆运动学计算，始终准确地踏在旋转的自行车脚踏板上。</desc>

    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#04263a"/>
        <stop offset=".28" stop-color="#12566a"/>
        <stop offset=".49" stop-color="#4c9797"/>
        <stop offset=".61" stop-color="#a9c7ac"/>
        <stop offset=".73" stop-color="#f0cc95"/>
        <stop offset="1" stop-color="#f6d7a1"/>
      </linearGradient>
      <radialGradient id="horizonWarm" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffd387" stop-opacity=".82"/>
        <stop offset=".5" stop-color="#ffc77a" stop-opacity=".32"/>
        <stop offset="1" stop-color="#ffc77a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff6c9" stop-opacity=".82"/>
        <stop offset=".28" stop-color="#ffe29b" stop-opacity=".55"/>
        <stop offset=".64" stop-color="#ffc36e" stop-opacity=".2"/>
        <stop offset="1" stop-color="#ffc36e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunCore" cx=".42" cy=".38" r=".65">
        <stop offset="0" stop-color="#fffce8"/>
        <stop offset=".55" stop-color="#ffe7a4"/>
        <stop offset="1" stop-color="#ffbf62"/>
      </radialGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4d9ba0"/>
        <stop offset=".36" stop-color="#25808e"/>
        <stop offset="1" stop-color="#0c5268"/>
      </linearGradient>
      <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#efdbae"/>
        <stop offset="1" stop-color="#d7b57d"/>
      </linearGradient>
      <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#28576a"/>
        <stop offset=".18" stop-color="#1e4859"/>
        <stop offset=".62" stop-color="#123444"/>
        <stop offset="1" stop-color="#071f2c"/>
      </linearGradient>
      <radialGradient id="trackGlow" cx=".5" cy=".35" r=".6">
        <stop offset="0" stop-color="#5aa8a5" stop-opacity=".22"/>
        <stop offset="1" stop-color="#5aa8a5" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bodyGrad" x1=".2" y1="0" x2=".82" y2="1">
        <stop offset="0" stop-color="#fffdf1"/>
        <stop offset=".55" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#e4c897"/>
      </linearGradient>
      <linearGradient id="wingGrad" x1=".1" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#fffdf3"/>
        <stop offset=".58" stop-color="#f9ebc8"/>
        <stop offset="1" stop-color="#d9bd89"/>
      </linearGradient>
      <linearGradient id="footGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffb44f"/>
        <stop offset="1" stop-color="#e87a2f"/>
      </linearGradient>
      <radialGradient id="vignette" cx=".5" cy=".48" r=".73">
        <stop offset=".48" stop-color="#03131d" stop-opacity="0"/>
        <stop offset=".78" stop-color="#03131d" stop-opacity=".14"/>
        <stop offset="1" stop-color="#03131d" stop-opacity=".6"/>
      </radialGradient>
      <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
        <rect width="28" height="28" fill="#f8e8bf"/>
        <rect width="14" height="14" fill="#0b2c3b"/>
        <rect x="14" y="14" width="14" height="14" fill="#0b2c3b"/>
      </pattern>
      <pattern id="wavePattern" width="280" height="56" patternUnits="userSpaceOnUse">
        <path d="M0 17q17-8 34 0t34 0t34 0t34 0t34 0t34 0t34 0t34 0" fill="none" stroke="#d7f5e7" stroke-width="2" opacity=".5"/>
        <path d="M52 39q14-7 28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="#d7f5e7" stroke-width="1.5" opacity=".25"/>
        <path d="M184 27q11-5 22 0t22 0t22 0" fill="none" stroke="#d7f5e7" stroke-width="1.2" opacity=".18"/>
      </pattern>
      <filter id="softShadow" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <filter id="blurSoft" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="2" seed="17" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncA type="table" tableValues="0 .6"/>
        </feComponentTransfer>
      </filter>
    </defs>

    <g id="world">
      <!-- sky and light -->
      <rect x="-60" y="-60" width="1720" height="1020" fill="url(#skyGrad)"/>
      <ellipse cx="1250" cy="480" rx="780" ry="220" fill="url(#horizonWarm)"/>
      <circle cx="1258" cy="326" r="232" fill="url(#sunGlow)"/>
      <circle cx="1258" cy="326" r="96" fill="url(#sunCore)"/>
      <circle cx="1258" cy="326" r="120" fill="none" stroke="#ffe8ae" stroke-width="1.2" opacity=".25"/>

      <g id="cloudLayer" fill="#fff1d7">

  const racers = [];

  function buildRacers() {
    for (const cfg of racerConfigs) {
      const template = document.createElementNS(NS, "g");
      template.innerHTML = racerMarkup(cfg);
      const root = template.firstElementChild;
      racerLayer.appendChild(root);

      const racer = {
        cfg,
        root,
        rearRotor: root.querySelector(".rear-wheel .rotor"),
        frontRotor: root.querySelector(".front-wheel .rotor"),
        chainring: root.querySelector(".chainring"),
        chain: root.querySelector(".chain"),
        nearCrank: root.querySelector(".near-crank"),
        farCrank: root.querySelector(".far-crank"),
        nearPedal: root.querySelector(".near-pedal"),
        farPedal: root.querySelector(".far-pedal"),
        nearLeg: {
          root: root.querySelector(".near-leg"),
          thighs: root.querySelectorAll(".near-leg .thigh"),
          shins: root.querySelectorAll(".near-leg .shin"),
          kneeOuter: root.querySelector(".near-leg .knee-outline"),
          kneeInner: root.querySelector(".near-leg .knee-fill"),
          foot: root.querySelector(".near-leg .foot")
        },
        farLeg: {
          root: root.querySelector(".far-leg"),
          thighs: root.querySelectorAll(".far-leg .thigh"),
          shins: root.querySelectorAll(".far-leg .shin"),
          kneeOuter: root.querySelector(".far-leg .knee-outline"),
          kneeInner: root.querySelector(".far-leg .knee-fill"),
          foot: root.querySelector(".far-leg .foot")
        },
        head: root.querySelector(".head"),
        tail: root.querySelector(".tail-feathers"),
        scarfOutline: root.querySelector(".scarf-outline"),
        scarfFill: root.querySelector(".scarf-fill"),
        scarfOutline2: root.querySelector(".scarf-outline2"),
        scarfFill2: root.querySelector(".scarf-fill2"),
        dust: []
      };

      const dustHost = root.querySelector(".dust");
      for (let i = 0; i < 8; i++) {
        const dot = document.createElementNS(NS, "ellipse");
        dot.setAttribute("fill", "#f0d49a");
        dot.setAttribute("opacity", "0");
        dustHost.appendChild(dot);
        racer.dust.push({
          el: dot,
          seed: i / 8 + cfg.phase * 0.09,
          rate: 0.6 + i * 0.035,
          lift: 0.35 + (i % 3) * 0.17
        });
      }

      racers.push(racer);
    }
  }

  function pedalPoint(angle) {
    const cx = 118;
    const cy = 24;
    const r = 29;
    return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
  }

  function solveKnee(hip, ankle, upper, lower) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const d = Math.max(0.001, Math.hypot(dx, dy));
    const ux = dx / d;
    const uy = dy / d;
    const a = (upper * upper - lower * lower + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, upper * upper - a * a));
    return {
      x: hip.x + ux * a + uy * h,
      y: hip.y + uy * a - ux * h
    };
  }

  function updateLeg(leg, hip, pedal, scaleForFar) {
    // The ankle sits 11px above the pedal spindle, which puts the flat sole
    // exactly on the top face of the pedal (the platform top is spindleY - 3).
    const ankle = { x: pedal.x, y: pedal.y - 11 };
    const knee = solveKnee(hip, ankle, 108, 108);

    const thighPath = `M${fixed(hip.x)} ${fixed(hip.y)}L${fixed(knee.x)} ${fixed(knee.y)}`;
    const shinPath = `M${fixed(knee.x)} ${fixed(knee.y)}L${fixed(ankle.x)} ${fixed(ankle.y)}`;

    for (const p of leg.thighs) p.setAttribute("d", thighPath);
    for (const p of leg.shins) p.setAttribute("d", shinPath);
    leg.kneeOuter.setAttribute("cx", fixed(knee.x));
    leg.kneeOuter.setAttribute("cy", fixed(knee.y));
    leg.kneeInner.setAttribute("cx", fixed(knee.x));
    leg.kneeInner.setAttribute("cy", fixed(knee.y));
    leg.foot.setAttribute("transform", `translate(${fixed(ankle.x)} ${fixed(ankle.y)})`);

    return Math.abs((ankle.y + 8) - (pedal.y - 3));
  }

  let lastContactError = 0;

  function renderRacers(t) {
    const cadenceRad = 8.2;
    let heroError = 0;

    racers.forEach((racer, index) => {
      const cfg = racer.cfg;
      const phase = t * cadenceRad + cfg.phase;
      const x = cfg.x + Math.sin(t * cfg.driftRate + cfg.driftPhase) * cfg.drift;
      racer.root.setAttribute("transform", `translate(${fixed(x)} ${fixed(cfg.y)}) scale(${cfg.scale})`);

      const nearPedal = pedalPoint(phase);
      const farPedal = pedalPoint(phase + Math.PI);
      racer.nearPedal.setAttribute("transform", `translate(${fixed(nearPedal.x)} ${fixed(nearPedal.y)})`);
      racer.farPedal.setAttribute("transform", `translate(${fixed(farPedal.x)} ${fixed(farPedal.y)})`);
      racer.nearCrank.setAttribute("d", `M118 24L${fixed(nearPedal.x)} ${fixed(nearPedal.y)}`);
      racer.farCrank.setAttribute("d", `M118 24L${fixed(farPedal.x)} ${fixed(farPedal.y)}`);

      const nearError = updateLeg(racer.nearLeg, { x: 22, y: -96 }, nearPedal, false);
      const farError = updateLeg(racer.farLeg, { x: 15, y: -93 }, farPedal, true);
      if (cfg.id === "hero") heroError = Math.max(nearError, farError);

      const wheelDeg = -degrees(phase * 1.95);
      racer.rearRotor.setAttribute("transform", `rotate(${fixed(wheelDeg)})`);
      racer.frontRotor.setAttribute("transform", `rotate(${fixed(wheelDeg)})`);
      racer.chainring.setAttribute("transform", `translate(118 24) rotate(${fixed(degrees(phase))})`);
      racer.chain.style.strokeDashoffset = fixed(-phase * 7);

      const headRot = -1.7 + Math.sin(phase * 2 + 0.4) * 1.6;
      racer.head.setAttribute("transform", `rotate(${fixed(headRot)} 92 -230)`);
      racer.tail.setAttribute("transform", `rotate(${fixed(Math.sin(phase * 2 + 1.2) * 2.8)} -22 -120)`);

      const waveA = Math.sin(phase * 1.7 + 0.7);
      const waveB = Math.cos(phase * 1.35 + 1.1);
      const waveC = Math.sin(phase * 2.05 + 2.2);
      racer.scarfOutline.setAttribute("d", `M78 -216C${fixed(52 + waveA * 5)} ${fixed(-226 + waveA * 5)} ${fixed(32 + waveB * 7)} ${fixed(-208 + waveB * 8)} ${fixed(8 + waveC * 9)} ${fixed(-222 + waveA * 9)}C${fixed(-18 + waveB * 11)} ${fixed(-236 + waveC * 9)} ${fixed(-40 + waveA * 12)} ${fixed(-217 + waveB * 11)} ${fixed(-63 + waveC * 13)} ${fixed(-226 + waveA * 12)}`);
      racer.scarfFill.setAttribute("d", racer.scarfOutline.getAttribute("d"));
      racer.scarfOutline2.setAttribute("d", `M72 -209C${fixed(50 + waveB * 5)} ${fixed(-218 + waveC * 5)} ${fixed(28 + waveA * 7)} ${fixed(-200 + waveA * 7)} ${fixed(4 + waveB * 9)} ${fixed(-210 + waveB * 8)}C${fixed(-15 + waveC * 10)} ${fixed(-218 + waveA * 9)} ${fixed(-31 + waveB * 11)} ${fixed(-206 + waveC * 10)} ${fixed(-48 + waveA * 12)} ${fixed(-211 + waveB * 11)}`);
      racer.scarfFill2.setAttribute("d", racer.scarfOutline2.getAttribute("d"));

      racer.dust.forEach((d) => {
        const p = (t * d.rate + d.seed) % 1;
        const px = -20 - p * 148;
        const py = 56 - p * 22 + Math.sin(t * 5 + d.seed * 19) * 2.2;
        d.el.setAttribute("cx", fixed(px));
        d.el.setAttribute("cy", fixed(py));
        d.el.setAttribute("rx", fixed(3.2 + p * 8.8));
        d.el.setAttribute("ry", fixed(1.8 + p * 4.6));
        d.el.setAttribute("opacity", fixed((1 - p) * 0.25));
      });
    });

    lastContactError = heroError;
  }

  function buildSpeedLines() {
    const lines = [];
    for (let i = 0; i < 14; i++) {
      const line = document.createElementNS(NS, "line");
      const y = 492 + (i * 71) % 312;
      const length = 62 + (i * 47) % 156;
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("stroke-width", i % 4 === 0 ? 2.2 : 1.2);
      line.setAttribute("opacity", 0.35 + (i % 3) * 0.2);
      speedLines.appendChild(line);
      lines.push({ el: line, y, length, offset: i * 173.3, speed: 0.72 + (i % 5) * 0.15 });
    }
    return lines;
  }

  let speedLineRefs = [];

  function renderSpeedLines(t) {
    for (const line of speedLineRefs) {
      const travel = 1850;
      const x = 1680 - ((t * 920 * line.speed + line.offset) % travel);
      line.el.setAttribute("x1", fixed(x));
      line.el.setAttribute("x2", fixed(x - line.length));
    }
  }

  function renderAmbient(t) {
    // A gentle sea scroll and checkered curb keep the whole world alive.
    const waveOffset = -(t * 18) % 280;
    waveSurface.setAttribute("patternTransform", `translate(${fixed(waveOffset)} 0)`);

    const curbOffset = -(t * 300) % 28;
    checkerCurb.setAttribute("patternTransform", `translate(${fixed(curbOffset)} 0)`);

    const scroll = (t * 138) % 1600;
    roadsideScroll.setAttribute("transform", `translate(${fixed(-scroll)} 0)`);

    if (laneLines) laneLines.setAttribute("stroke-dashoffset", fixed(t * 590));

    cloudNodes.forEach((cloud, i) => {
      const cx = cloud.x + Math.sin(t * 0.018 + i * 1.7) * 16;
      const cy = cloud.y + Math.sin(t * 0.11 + i * 2.1) * 2.4;
      cloud.el.setAttribute("transform", `translate(${fixed(cx)} ${fixed(cy)}) scale(${cloud.s})`);
    });

    birdNodes.forEach((bird, i) => {
      const flap = Math.sin(t * 2.8 + i * 1.9);
      bird.el.setAttribute("transform", `translate(${fixed(bird.x + Math.sin(t * 0.17 + i) * 12)} ${fixed(bird.y + Math.sin(t * 0.8 + i * 2) * 3)}) scale(${bird.s} ${fixed(bird.s * (0.72 + Math.abs(flap) * 0.28))})`);
    });

    sunReflection.setAttribute("opacity", fixed(0.82 + Math.sin(t * 1.3) * 0.09));
    sunReflection.setAttribute("transform", `translate(${fixed(Math.sin(t * 0.9) * 5)} 0)`);

    if (!reducedMotion) {
      const sx = Math.sin(t * 13.1) * 0.75 + Math.sin(t * 7.3) * 0.45;
      const sy = Math.cos(t * 11.7) * 0.6 + Math.sin(t * 5.9) * 0.4;
      world.setAttribute("transform", `translate(${fixed(sx)} ${fixed(sy)})`);
    }
  }

  const speedValue = document.getElementById("speedValue");
  const cadenceValue = document.getElementById("cadenceValue");
  const clockValue = document.getElementById("clockValue");
  const leadMargin = document.getElementById("leadMargin");
  const contactError = document.getElementById("contactError");

  function formatClock(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    const tenths = Math.floor((seconds % 1) * 10);
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${tenths}`;
  }

  function renderUi(t) {
    const speed = 48.2 + Math.sin(t * 0.72) * 1.55 + Math.sin(t * 2.1 + 1.2) * 0.55;
    const cadence = 78 + Math.sin(t * 0.82 + 0.8) * 1.2;
    speedValue.textContent = speed.toFixed(1);
    cadenceValue.textContent = String(Math.round(cadence));
    clockValue.textContent = formatClock(state.elapsed + t);
    leadMargin.textContent = (0.18 + Math.sin(t * 0.9) * 0.03).toFixed(2);
    contactError.textContent = lastContactError.toFixed(2);
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - state.last) / 1000));
    state.last = now;
    if (state.playing) state.time += dt * state.speed;

    const t = state.time;
    renderRacers(t);
    renderAmbient(t);
    renderSpeedLines(t);
    renderUi(t);
    requestAnimationFrame(frame);
  }

  function syncPauseButton() {
    stage.classList.toggle("is-paused", !state.playing);
    const btn = document.getElementById("pauseBtn");
    btn.setAttribute("aria-label", state.playing ? "暂停动画" : "继续动画");
  }

  function togglePause() {
    state.playing = !state.playing;
    state.last = performance.now();
    syncPauseButton();
  }

  const speeds = [1, 0.5, 0.25];
  let speedIndex = 0;
  function cycleSpeed() {
    speedIndex = (speedIndex + 1) % speeds.length;
    state.speed = speeds[speedIndex];
    const btn = document.getElementById("speedBtn");
    btn.textContent = speeds[speedIndex] + "×";
    btn.setAttribute("aria-label", `切换动画速度，当前 ${speeds[speedIndex]} 倍速`);
  }

  function fitScene() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const aspect = w / Math.max(1, h);

    if (aspect > 1.78) {
      // On very wide screens, bias the crop toward the wheels so the
      // handlebar/foot contact area stays above the bottom HUD.
      const viewHeight = 1600 / aspect;
      const y = Math.max(0, 880 - viewHeight);
      scene.setAttribute("viewBox", `0 ${fixed(y)} 1600 ${fixed(viewHeight)}`);
      return;
    }

    if (aspect >= 1.45) {
      scene.setAttribute("viewBox", "0 0 1600 900");
      return;
    }

    const viewWidth = Math.max(560, Math.min(1260, 900 * aspect));
    const center = aspect < 0.85 ? 610 : 720;
    let x = center - viewWidth / 2;
    x = Math.max(0, Math.min(1600 - viewWidth, x));
    scene.setAttribute("viewBox", `${fixed(x)} 0 ${fixed(viewWidth)} 900`);
  }

  function initRoadsideClone() {
    const tile = document.getElementById("roadsideTile");
    const clone = tile.cloneNode(true);
    clone.removeAttribute("id");
    clone.setAttribute("transform", "translate(1600 0)");
    roadsideScroll.appendChild(clone);
  }

  function init() {
    buildRacers();
    speedLineRefs = buildSpeedLines();
    initRoadsideClone();
    fitScene();
    syncPauseButton();
    if (reducedMotion) {
      document.getElementById("speedBtn").textContent = "0.35×";
      document.getElementById("speedBtn").setAttribute("aria-label", "切换动画速度，当前 0.35 倍速");
    }

    document.getElementById("pauseBtn").addEventListener("click", togglePause);
    document.getElementById("speedBtn").addEventListener("click", cycleSpeed);

    window.addEventListener("resize", fitScene, { passive: true });
    window.addEventListener("orientationchange", () => setTimeout(fitScene, 80), { passive: true });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
      } else if (event.key === "s" || event.key === "S") {
        event.preventDefault();
        cycleSpeed();
      }
    });

    document.addEventListener("visibilitychange", () => {
      state.last = performance.now();
    });

    requestAnimationFrame(frame);
  }

  init();
})();
</script>
</body>
</html>
